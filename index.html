<!DOCTYPE html>
<html>
<head>
<title>Kleinkel Tech Hub — PS4 GoldHEN</title>

<style>
/* ── Reset & base styles ─────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{
  min-height:100%;
  background:#050914;
  color:#e2eaf5;
  font-family:'Courier New',Courier,monospace;
  text-align:center;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
h1{color:#e2eaf5;text-shadow:none;font-size:inherit;font-weight:normal;}
a{text-decoration:none;}
hr{display:none;}

/* ── Grid pattern background ──────────────────────────────────── */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(0,180,255,0.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,180,255,0.035) 1px,transparent 1px);
  background-size:44px 44px;
  pointer-events:none;z-index:0;
}

/* ── Wrapper ──────────────────────────────────────────────────── */
.hub-wrap{
  position:relative;z-index:1;
  width:100%;max-width:520px;
  padding:30px 20px 28px;
  display:flex;flex-direction:column;
  align-items:center;gap:22px;
  min-height:100vh;justify-content:center;
}

/* ── Brand ────────────────────────────────────────────────────── */
.brand-name{
  font-family:Arial Black,Arial,Helvetica,sans-serif;
  font-size:clamp(36px,11vw,58px);
  font-weight:900;letter-spacing:0.1em;
  color:#e2eaf5;line-height:1;
}
.brand-name .ac{color:#00CFFF;}
.brand-sub{font-size:12px;color:#2a3a55;letter-spacing:0.14em;margin-top:8px;}

/* ── Animated ring ────────────────────────────────────────────── */
.ring-wrap{position:relative;width:110px;height:110px;flex-shrink:0;}
.ring-svg{
  width:100%;height:100%;
  animation:ring-spin 2.4s linear infinite;
  filter:drop-shadow(0 0 7px #00CFFF);
  transition:filter 0.5s;
}
.ring-arc{
  stroke:#00CFFF;
  stroke-dasharray:283;stroke-dashoffset:71;
  stroke-linecap:round;
  transition:stroke 0.5s;
}
.ring-track{stroke:rgba(0,207,255,0.1);}
.ring-dot{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:12px;height:12px;border-radius:50%;
  background:#00CFFF;
  box-shadow:0 0 10px #00CFFF,0 0 22px rgba(0,207,255,0.4);
  animation:dpulse 1.5s ease-in-out infinite alternate;
  transition:background 0.5s,box-shadow 0.5s;
}

/* ── FW badge ─────────────────────────────────────────────────── */
.fw-badge{
  padding:7px 18px;
  border:1px solid rgba(0,207,255,0.18);
  border-radius:20px;
  font-size:11px;color:#3e5878;
  letter-spacing:0.08em;
}
.fw-badge span{color:#00CFFF;}

/* ── Status box ───────────────────────────────────────────────── */
.status-box{
  width:100%;
  background:rgba(5,12,28,0.85);
  border:1px solid rgba(0,207,255,0.14);
  border-radius:6px;overflow:hidden;
}
.status-hdr{
  padding:8px 14px;
  border-bottom:1px solid rgba(0,207,255,0.1);
  display:flex;align-items:center;gap:8px;
  font-size:10px;color:#2a3a55;letter-spacing:0.12em;
}
#sdot{
  width:6px;height:6px;border-radius:50%;
  background:#00CFFF;box-shadow:0 0 6px #00CFFF;
  animation:dpulse 1.5s ease-in-out infinite alternate;
  transition:background 0.5s,box-shadow 0.5s;
  flex-shrink:0;
}
/* #msgs is the element ALL exploit scripts write to */
#msgs{
  display:block;
  padding:22px 16px;
  font-family:'Courier New',Courier,monospace;
  font-size:clamp(13px,3.5vw,17px);
  color:#00CFFF;
  text-align:center;line-height:1.6;
  text-shadow:0 0 12px rgba(0,207,255,0.35);
  transition:color 0.5s,text-shadow 0.5s;
}

/* ── Credits ──────────────────────────────────────────────────── */
.credits{font-size:10px;color:#1e2d42;letter-spacing:0.05em;line-height:2.2;}
.credits a{color:#1e3650;transition:color 0.2s;}
.credits a:hover{color:#00CFFF;}

/* ── Keyframes ────────────────────────────────────────────────── */
@keyframes ring-spin{to{transform:rotate(360deg);}}
@keyframes dpulse{
  from{transform:translate(-50%,-50%) scale(0.7);opacity:0.5;}
  to{transform:translate(-50%,-50%) scale(1.2);opacity:1;}
}
/* State overrides — applied by MutationObserver below */
body.s-ok .ring-arc{stroke:#22D68A;}
body.s-ok .ring-svg{filter:drop-shadow(0 0 7px #22D68A);animation-duration:5s;}
body.s-ok .ring-dot{background:#22D68A;box-shadow:0 0 10px #22D68A,0 0 22px rgba(34,214,138,0.4);}
body.s-ok #sdot{background:#22D68A;box-shadow:0 0 6px #22D68A;}
body.s-ok #msgs{color:#22D68A;text-shadow:0 0 12px rgba(34,214,138,0.35);}

body.s-err .ring-arc{stroke:#F05050;}
body.s-err .ring-svg{filter:drop-shadow(0 0 7px #F05050);animation:none;}
body.s-err .ring-dot{background:#F05050;box-shadow:0 0 10px #F05050;animation:none;}
body.s-err #sdot{background:#F05050;box-shadow:0 0 6px #F05050;animation:none;}
body.s-err #msgs{color:#F05050;text-shadow:0 0 12px rgba(240,80,80,0.3);}
</style>
</head>
<body>

<!-- ═══ ORIGINAL EXPLOIT SCRIPT — NOT MODIFIED ══════════════════ -->
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "Only for PS4 with Firmware 5.05 and 7.00 to 13.52";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.52) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js?v=10";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>
<!-- ═══ END ORIGINAL EXPLOIT SCRIPT ═════════════════════════════ -->

<!-- ── New Visual Shell ──────────────────────────────────────── -->
<div class="hub-wrap">

  <div>
    <div class="brand-name">KLEINKEL <span class="ac">TECH HUB</span></div>
    <div class="brand-sub">PS4 &middot; GOLDHEN v2.4b18.12 &middot; FW 5.05 &mdash; 13.52</div>
  </div>

  <div class="ring-wrap" aria-hidden="true">
    <svg class="ring-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle class="ring-track" cx="50" cy="50" r="45" fill="none" stroke-width="2"/>
      <circle class="ring-arc"   cx="50" cy="50" r="45" fill="none" stroke-width="2.5"
        transform="rotate(-90 50 50)"/>
    </svg>
    <div class="ring-dot"></div>
  </div>

  <div class="fw-badge" id="fw-badge">Detecting firmware&hellip;</div>

  <div class="status-box">
    <div class="status-hdr">
      <div id="sdot"></div>
      SYSTEM STATUS
    </div>
    <h1 id="msgs">Loading GoldHEN v2.4b18.12... Please Wait</h1>
  </div>

  <div class="credits">Special honour to all developers in the PS4 Scene</div>

</div>

<!-- ── UI state observer (cosmetic only) ─────────────────────── -->
<script>
(function(){
  // Show detected firmware in the badge
  var badge = document.getElementById('fw-badge');
  if(badge){
    if(typeof isPS4 !== 'undefined' && isPS4){
      badge.innerHTML = 'PS4 &middot; FW <span>' + (typeof fwVersion !== 'undefined' ? fwVersion : '?') + '</span>';
    } else if(typeof isPS4 !== 'undefined') {
      badge.textContent = 'Not a PS4 browser';
    }
  }

  // Watch #msgs for state changes → update ring & dot colour
  var el = document.getElementById('msgs');
  if(!el) return;
  function sync(){
    var t = el.textContent.toLowerCase() + el.innerHTML.toLowerCase();
    document.body.classList.remove('s-ok','s-err');
    if(t.indexOf('✔') !== -1 || t.indexOf('success') !== -1 || t.indexOf('close') !== -1 || t.indexOf('re-open') !== -1){
      document.body.classList.add('s-ok');
    } else if(t.indexOf('error') !== -1 || t.indexOf('fail') !== -1 || t.indexOf('not found') !== -1 || t.indexOf('unsupported') !== -1){
      document.body.classList.add('s-err');
    }
  }
  sync();
  var obs = new MutationObserver(sync);
  obs.observe(el, {childList:true, subtree:true, characterData:true});
})();
</script>

</body>
</html>
