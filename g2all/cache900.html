<!DOCTYPE html>
<html manifest="900.manifest">
<head>
<title>Kleinkel Tech Hub — PS4 GoldHEN</title>
<link rel="stylesheet" href="../style.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{
  min-height:100%;background:#050914;color:#e2eaf5;
  font-family:'Courier New',Courier,monospace;
  text-align:center;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
h1{color:#e2eaf5;text-shadow:none;font-size:inherit;font-weight:normal;}
a{text-decoration:none;}hr{display:none;}
body::before{
  content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(0,180,255,0.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,180,255,0.035) 1px,transparent 1px);
  background-size:44px 44px;pointer-events:none;z-index:0;
}
.hub-wrap{
  position:relative;z-index:1;width:100%;max-width:520px;
  padding:30px 20px 28px;display:flex;flex-direction:column;
  align-items:center;gap:22px;min-height:100vh;justify-content:center;
}
.brand-name{
  font-family:Arial Black,Arial,Helvetica,sans-serif;
  font-size:clamp(18px,6vw,28px);font-weight:900;
  letter-spacing:0.1em;color:#e2eaf5;line-height:1;
}
.brand-name .ac{color:#00CFFF;}
.brand-sub{font-size:10px;color:#2a3a55;letter-spacing:0.12em;margin-top:5px;}
.ring-wrap{position:relative;width:110px;height:110px;flex-shrink:0;}
.ring-svg{
  width:100%;height:100%;
  animation:ring-spin 2.4s linear infinite;
  filter:drop-shadow(0 0 7px #00CFFF);transition:filter 0.5s;
}
.ring-arc{
  stroke:#00CFFF;stroke-dasharray:283;stroke-dashoffset:71;
  stroke-linecap:round;transition:stroke 0.5s;
}
.ring-track{stroke:rgba(0,207,255,0.1);}
.ring-dot{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:12px;height:12px;border-radius:50%;
  background:#00CFFF;box-shadow:0 0 10px #00CFFF,0 0 22px rgba(0,207,255,0.4);
  animation:dpulse 1.5s ease-in-out infinite alternate;
  transition:background 0.5s,box-shadow 0.5s;
}
.progress-track{
  width:min(340px,85vw);height:3px;
  background:rgba(0,207,255,0.08);border-radius:3px;overflow:hidden;
}
.progress-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,#7B5EF8,#00CFFF);
  border-radius:3px;transition:width 0.3s ease;
  box-shadow:0 0 8px rgba(0,207,255,0.5);
}
.status-box{
  width:100%;background:rgba(5,12,28,0.85);
  border:1px solid rgba(0,207,255,0.14);border-radius:6px;overflow:hidden;
}
.status-hdr{
  padding:8px 14px;border-bottom:1px solid rgba(0,207,255,0.1);
  display:flex;align-items:center;gap:8px;
  font-size:10px;color:#2a3a55;letter-spacing:0.12em;
}
#sdot{
  width:6px;height:6px;border-radius:50%;
  background:#00CFFF;box-shadow:0 0 6px #00CFFF;
  animation:dpulse 1.5s ease-in-out infinite alternate;
  transition:background 0.5s,box-shadow 0.5s;flex-shrink:0;
}
#msgs{
  display:block;padding:22px 16px;
  font-family:'Courier New',Courier,monospace;
  font-size:clamp(13px,3.5vw,17px);
  color:#00CFFF;text-align:center;line-height:1.6;
  text-shadow:0 0 12px rgba(0,207,255,0.35);
  transition:color 0.5s,text-shadow 0.5s;
}
.credits{font-size:10px;color:#1e2d42;letter-spacing:0.05em;line-height:2.2;}
.credits a{color:#1e3650;transition:color 0.2s;}
.credits a:hover{color:#00CFFF;}
@keyframes ring-spin{to{transform:rotate(360deg);}}
@keyframes dpulse{
  from{transform:translate(-50%,-50%) scale(0.7);opacity:0.5;}
  to{transform:translate(-50%,-50%) scale(1.2);opacity:1;}
}
body.s-ok .ring-arc{stroke:#22D68A;}
body.s-ok .ring-svg{filter:drop-shadow(0 0 7px #22D68A);animation-duration:6s;}
body.s-ok .ring-dot{background:#22D68A;box-shadow:0 0 10px #22D68A,0 0 22px rgba(34,214,138,0.4);}
body.s-ok #sdot{background:#22D68A;box-shadow:0 0 6px #22D68A;}
body.s-ok #msgs{color:#22D68A;text-shadow:0 0 12px rgba(34,214,138,0.35);}
body.s-err .ring-arc{stroke:#F05050;}
body.s-err .ring-svg{filter:drop-shadow(0 0 7px #F05050);animation:none;}
body.s-err .ring-dot{background:#F05050;box-shadow:0 0 10px #F05050;animation:none;}
body.s-err #sdot{background:#F05050;box-shadow:0 0 6px #F05050;animation:none;}
body.s-err #msgs{color:#F05050;text-shadow:0 0 12px rgba(240,80,80,0.3);}
body.s-ok .progress-fill{width:100%;background:#22D68A;box-shadow:0 0 8px rgba(34,214,138,0.5);}
</style>
</head>
<body>

<!-- ═══ ORIGINAL CACHE SCRIPT — NOT MODIFIED ════════════════════ -->
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML="Installing Offline Cache: " + Percent + "%";if(window._pfill)window._pfill.style.width=Percent+"%";}
function DisplayCacheProgress(){window.msgs.innerHTML="Cache Installed Successfully ✔";setTimeout(function(){window.msgs.innerHTML="Now Close And Re-Open Your Browser ...";},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="Error Installing Cache! - Clear and Re-Open Your Browser ...";};
</script>
<!-- ═══ END ORIGINAL CACHE SCRIPT ═══════════════════════════════ -->

<div class="hub-wrap">

  <div>
    <div class="brand-name">KLEINKEL <span class="ac">TECH HUB</span></div>
    <div class="brand-sub">INSTALLING OFFLINE CACHE &middot; DO NOT CLOSE</div>
  </div>

  <div class="ring-wrap" aria-hidden="true">
    <svg class="ring-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle class="ring-track" cx="50" cy="50" r="45" fill="none" stroke-width="2"/>
      <circle class="ring-arc"   cx="50" cy="50" r="45" fill="none" stroke-width="2.5"
        transform="rotate(-90 50 50)"/>
    </svg>
    <div class="ring-dot"></div>
  </div>

  <div class="progress-track">
    <div class="progress-fill" id="pfill"></div>
  </div>

  <div class="status-box">
    <div class="status-hdr"><div id="sdot"></div>CACHE STATUS</div>
    <h1 id="msgs">Starting Cache Installation...</h1>
  </div>

  <div class="credits">
    Special honour to all developers in the PS4 Scene
  </div>

</div>

<script>
(function(){
  window._pfill = document.getElementById('pfill');
  var el = document.getElementById('msgs');
  if(!el) return;
  function sync(){
    var t = el.textContent.toLowerCase() + el.innerHTML.toLowerCase();
    document.body.classList.remove('s-ok','s-err');
    if(t.indexOf('✔') !== -1 || t.indexOf('success') !== -1 || t.indexOf('close') !== -1 || t.indexOf('re-open') !== -1){
      document.body.classList.add('s-ok');
    } else if(t.indexOf('error') !== -1 || t.indexOf('fail') !== -1){
      document.body.classList.add('s-err');
    }
  }
  sync();
  var obs = new MutationObserver(sync);
  obs.observe(el, {childList:true,subtree:true,characterData:true});
})();
</script>

</body>
</html>
